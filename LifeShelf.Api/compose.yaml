services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeshelf-api
    ports:
      - "5151:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LifeShelfDatabase: "Server=db,1433;Database=LifeShelfDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lifeshelf-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - lifeshelf-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  lifeshelf-sql-data:
