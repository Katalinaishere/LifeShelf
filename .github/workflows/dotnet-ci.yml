

name: LifeShelf API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore LifeShelf.Api/LifeShelf.Api.csproj

      - name: Build API
        run: dotnet build LifeShelf.Api/LifeShelf.Api.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test LifeShelf.Api.Tests/LifeShelf.Api.Tests.csproj --configuration Release
