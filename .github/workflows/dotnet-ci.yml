
name: LifeShelf API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore LifeShelf.Api/LifeShelf.Api.csproj

      - name: Build API
        run: dotnet build LifeShelf.Api/LifeShelf.Api.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test LifeShelf.Api.Tests/LifeShelf.Api.Tests.csproj --configuration Release

           - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./LifeShelf.Api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/katalinaishere/lifeshelf-api:latest
            ghcr.io/katalinaishere/lifeshelf-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Katalinaishere/LifeShelf
